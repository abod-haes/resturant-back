name: Quality Gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: restaurant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant -d restaurant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://restaurant:test-password@localhost:5432/restaurant_test
      DB_CONNECT_TIMEOUT_MS: 2000
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
      MEDIA_ALLOWED_ORIGINS: https://images.example.test
      QR_TOKEN_ENCRYPTION_KEY: 345618728b95fc72f82ca89322f4e1f673568be64736c395e1b27aae65a65df4
      PUSH_TOKEN_ENCRYPTION_KEY: 67250bd87f9321cad5ae622c3e572ffc58926ae0b5d38e25a837819acb703e51
      PUSH_DISPATCH_ENABLED: "false"
      MEDIA_S3_BUCKET: restaurant-media-test
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_ACCESS_KEY_ID: fake-test-key
      MEDIA_S3_SECRET_ACCESS_KEY: fake-test-secret
      MEDIA_PUBLIC_ORIGIN: https://cdn.example.test
      CUSTOMER_APP_ORIGIN: https://customer.example.test
      AUTH_ACCESS_SECRET: ci-only-test-jwt-signing-key-2026-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run db:migrate # idempotency: reapply is a no-op
      - run: npm run db:migrate:check
      - run: npm run check:architecture
      - run: npm run check:contract
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run contract:export
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-openapi-runtime
          path: artifacts/restaurant.openapi.json
          if-no-files-found: error
          retention-days: 60
      - run: node --test test/deployment/dockerfile-scripts.test.mjs
      - run: node --test test/deployment/seed-demo.test.mjs
