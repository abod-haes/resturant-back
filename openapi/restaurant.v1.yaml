openapi: 3.1.0
info:
  title: Restaurant Platform API
  version: 0.6.0-draft
  description: "Initial executable contract slice. Remaining endpoints documented in docs/OPENAPI_IMPLEMENTATION.md; do not treat this file as complete."
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        requestId: { type: string }
    PageMeta:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, "null"] }
        hasMore: { type: boolean }
    RestaurantSummary:
      type: object
      required: [id, name, slug, isActive, createdAt, owner]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        owner:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, username]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                username: { type: string }
    Plan:
      type: object
      required: [id, name, maxBranches, maxTables, maxEmployees, features, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        maxBranches: { type: integer, minimum: 1 }
        maxTables: { type: integer, minimum: 1 }
        maxEmployees: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        features:
          type: object
          required: [menu, waiter_calls, hookah_calls, analytics]
          properties:
            menu: { type: boolean }
            waiter_calls: { type: boolean }
            hookah_calls: { type: boolean }
            analytics: { type: boolean }
    Subscription:
      type: object
      required: [id, restaurantId, planId, period, effectiveStatus, canOperate, graceDays, startsAt, endsAt, graceEndsAt, entitlements]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        period: { type: string, enum: [monthly, yearly] }
        effectiveStatus: { type: string, enum: [pending, scheduled, active, grace, expired, cancelled] }
        canOperate: { type: boolean }
        startsAt: { type: [string, "null"], format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
        graceEndsAt: { type: [string, "null"], format: date-time }
        graceDays: { type: integer, minimum: 0, maximum: 365 }
        entitlements:
          oneOf:
            - type: "null"
            - type: object
              properties:
                maxBranches: { type: integer }
                maxTables: { type: integer }
                maxEmployees: { type: integer }
                features: { type: object }
    RenewalContact:
      type: object
      required: [type, label, value, enabled]
      properties:
        type: { type: string, enum: [whatsapp, phone, email] }
        label: { type: string }
        value: { type: string }
        enabled: { type: boolean }
    Branch:
      type: object
      required: [id, name, slug, currency, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        currency: { type: [string, "null"], maxLength: 3 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, branchId, name, description, sortOrder, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProductImage:
      type: object
      required: [id, url, alt, sortOrder]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: Approved HTTPS CDN origin only }
        alt: { type: [string, "null"] }
        sortOrder: { type: integer }
    Product:
      type: object
      required: [id, branchId, categoryId, name, description, priceMinor, oldPriceMinor, currency, tags, isVisible, isSoldOut, sortOrder, images, createdAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
        oldPriceMinor: { type: [integer, "null"] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        tags: { type: array, items: { type: string }, maxItems: 12 }
        isVisible: { type: boolean }
        isSoldOut: { type: boolean }
        sortOrder: { type: integer }
        images: { type: array, items: { $ref: '#/components/schemas/ProductImage' }, maxItems: 8 }
        createdAt: { type: string, format: date-time }
    CreateCategory:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 1000 }
        sortOrder: { type: integer, minimum: 0, maximum: 1000000 }
        isActive: { type: boolean }
    CreateProduct:
      type: object
      additionalProperties: false
      required: [categoryId, name, priceMinor]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 3000 }
        priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
        oldPriceMinor: { type: [integer, "null"], minimum: 1 }
        tags: { type: array, maxItems: 12, uniqueItems: true, items: { type: string, maxLength: 32 } }
        isVisible: { type: boolean }
        isSoldOut: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
        images:
          type: array
          maxItems: 8
          items:
            type: object
            required: [url]
            properties:
              url: { type: string, format: uri, description: Allowed HTTPS origin, no query/hash }
              alt: { type: [string, "null"] }
    ServiceCall:
      type: object
      required: [id, createdAt, deliveryState, ownerAlerted]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        deliveryState: { type: string, enum: [queued, no_staff] }
        ownerAlerted: { type: boolean }
paths:
  /admin/restaurants:
    post:
      operationId: createRestaurant
      tags: [Platform restaurants]
      security: [{ bearerAuth: [] }]
      description: Atomic creation of restaurant, owner and first branch. No subscription is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, owner, initialBranch]
              properties:
                name: { type: string, maxLength: 200 }
                owner:
                  type: object
                  required: [name, username, initialPassword]
                  properties:
                    name: { type: string, maxLength: 200 }
                    username: { type: string, minLength: 3, maxLength: 64 }
                    initialPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
                initialBranch:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Created restaurant, owner and first branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, name, ownerId, branchId]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      ownerId: { type: string, format: uuid }
                      branchId: { type: string, format: uuid }
        '400': { description: Invalid request }
        '401': { description: Unauthorized }
        '403': { description: Not a platform administrator }
        '409': { description: OWNER_USERNAME_TAKEN }
    get:
      operationId: listRestaurants
      tags: [Platform restaurants]
      security: [{ bearerAuth: [] }]
      description: Stable keyset pagination ordered newest-first, with literal case-insensitive search.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Paginated restaurant summaries
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RestaurantSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { description: Bad pagination parameters }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /admin/restaurants/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRestaurant
      tags: [Platform restaurants]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Restaurant details with first branch
        '400': { description: Invalid ID }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Restaurant not found }
    patch:
      operationId: updateRestaurant
      tags: [Platform restaurants]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200 }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated restaurant details }
        '400': { description: Invalid patch }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Restaurant not found }
  /admin/plans:
    get:
      operationId: listPlans
      tags: [Plans]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Stable keyset page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Plan' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
    post:
      operationId: createPlan
      tags: [Plans]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, maxBranches, maxTables, maxEmployees, features]
              properties:
                name: { type: string, maxLength: 120 }
                maxBranches: { type: integer, minimum: 1 }
                maxTables: { type: integer, minimum: 1 }
                maxEmployees: { type: integer, minimum: 0 }
                features:
                  type: object
                  required: [menu, waiter_calls, hookah_calls, analytics]
                  properties:
                    menu: { type: boolean }
                    waiter_calls: { type: boolean }
                    hookah_calls: { type: boolean }
                    analytics: { type: boolean }
      responses:
        '201': { description: Plan created }
        '400': { description: Invalid plan }
        '409': { description: PLAN_NAME_TAKEN }
  /admin/plans/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPlan
      tags: [Plans]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Plan }
        '404': { description: Plan not found }
    patch:
      operationId: patchPlan
      tags: [Plans]
      security: [{ bearerAuth: [] }]
      description: Partial plan updates do not affect existing subscription entitlement snapshots.
      responses:
        '200': { description: Updated plan }
        '400': { description: Invalid fields }
        '409': { description: PLAN_NAME_TAKEN }
  /admin/restaurants/{restaurantId}/subscriptions:
    post:
      operationId: createPendingSubscription
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, period]
              properties:
                planId: { type: string, format: uuid }
                period: { type: string, enum: [monthly, yearly] }
      responses:
        '201': { description: Pending manual subscription created }
        '400': { description: PLAN_UNAVAILABLE or invalid body }
        '404': { description: Restaurant not found }
        '409': { description: SUBSCRIPTION_PENDING }
  /admin/restaurants/{restaurantId}/subscription:
    get:
      operationId: getRestaurantSubscription
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Current or latest subscription, nullable }
  /admin/subscriptions/{id}/activate:
    post:
      operationId: activateSubscription
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graceDays]
              properties:
                startsAt: { type: string, format: date-time, description: Must end in Z }
                graceDays: { type: integer, minimum: 0, maximum: 365 }
      responses:
        '200': { description: Subscription activated with snapshot }
        '400': { description: Invalid body/plan }
        '404': { description: Subscription missing }
        '409': { description: Existing active subscription or invalid status }
  /admin/subscriptions/{id}/renew:
    post:
      operationId: renewSubscription
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graceDays]
              properties:
                period: { type: string, enum: [monthly, yearly] }
                graceDays: { type: integer, minimum: 0, maximum: 365 }
      responses:
        '200': { description: Term renewed and recorded atomically }
        '400': { description: Invalid fields/plan }
        '404': { description: Subscription missing }
        '409': { description: Subscription is not renewable }
  /admin/contact-methods:
    get:
      operationId: listRenewalContacts
      tags: [Renewal contacts]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Configured renewal channels }
    patch:
      operationId: replaceRenewalContacts
      tags: [Renewal contacts]
      security: [{ bearerAuth: [] }]
      description: Atomically replaces at most ten renewal channels with audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                contacts:
                  type: array
                  maxItems: 10
                  items: { $ref: '#/components/schemas/RenewalContact' }
      responses:
        '200': { description: Updated contact list }
        '400': { description: Invalid channels }
  /owner/subscription:
    get:
      operationId: getOwnerSubscription
      tags: [Owner subscription]
      security: [{ bearerAuth: [] }]
      description: Tenant-scoped subscription state and active renewal contacts remain readable after expiry.
      responses:
        '200':
          description: Current subscription and enabled contact methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subscription:
                        oneOf:
                          - type: 'null'
                          - $ref: '#/components/schemas/Subscription'
                      canOperate: { type: boolean }
                      renewalContacts:
                        type: array
                        items: { $ref: '#/components/schemas/RenewalContact' }
        '401': { description: Unauthorized }
        '403': { description: Not a restaurant owner }
  /owner/branches:
    get:
      operationId: listOwnerBranches
      tags: [Owner branches]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Tenant-scoped paginated branch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Branch' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { description: Unauthorized }
        '403': { description: Subscription inactive or wrong role }
    post:
      operationId: createOwnerBranch
      tags: [Owner branches]
      security: [{ bearerAuth: [] }]
      description: Transactionally enforces plan maxBranches including disabled branches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                currency: { type: string, pattern: '^[A-Z]{3}
    post:
      operationId: authLogin
      tags: [Authentication]
      description: Browser receives an HttpOnly refresh cookie; mobile receives refreshToken in JSON. Access token lasts 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
                client: { type: string, enum: [web, mobile], default: web }
      responses:
        '200': { description: Session issued }
        '400': { description: Validation failure }
        '401': { description: Invalid username, password or inactive user }
        '429': { description: Login throttled }
  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [Authentication]
      description: Refreshes and atomically rotates opaque credential. Body refreshToken is for mobile clients; web uses HttpOnly cookie and trusted Origin.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Mobile clients only }
      responses:
        '200': { description: Rotated session }
        '401': { description: Invalid or replayed refresh credential }
  /auth/logout:
    post:
      operationId: authLogout
      tags: [Authentication]
      description: Revoke the credential's session, including its access token.
      responses:
        '200': { description: Session revoked }
        '401': { description: Invalid credential }
  /auth/me:
    get:
      operationId: authMe
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user scope and password-change state }
        '401': { description: Missing or revoked session }
  /auth/change-password:
    post:
      operationId: authChangePassword
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      description: Sets a new password, clears the initial-change flag and revokes all sessions. Client must log in again.
      responses:
        '200': { description: Password changed }
        '400': { description: Invalid password }
        '401': { description: Missing or revoked session }
        '403': { description: Current password incorrect }
  /health/live:
    get:
      operationId: healthLive
      responses:
        '200': { description: Process is live }
  /health/ready:
    get:
      operationId: healthReady
      responses:
        '200': { description: Database is reachable }
        '503': { description: Database unavailable }
  /public/t/{qrToken}/sessions:
    post:
      operationId: createTableSession
      parameters:
        - in: path
          name: qrToken
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sessionToken, expiresAt, firstCallNeedsConfirmation]
                    properties:
                      sessionToken: { type: string }
                      expiresAt: { type: integer, format: int64, description: Unix timestamp in milliseconds }
                      firstCallNeedsConfirmation: { type: boolean }
        '410': { description: QR revoked }
        '403': { description: Subscription inactive }
  /public/calls:
    post:
      operationId: createServiceCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionToken, type, idempotencyKey]
              properties:
                sessionToken: { type: string }
                type: { type: string, enum: [waiter, hookah] }
                idempotencyKey: { type: string }
      responses:
        '201':
          description: Call recorded; not necessarily delivered
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceCall'
        '429': { description: Cooldown active; retryAfterSeconds in error details }
        '403': { description: Calls disabled }
        '401': { description: Session expired }
 }
      responses:
        '201': { description: Branch created }
        '400': { description: Validation error }
        '403': { description: Subscription inactive or PLAN_LIMIT_REACHED }
  /owner/branches/{branchId}:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnerBranch
      tags: [Owner branches]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Branch }
        '404': { description: Branch not found in tenant }
    patch:
      operationId: updateOwnerBranch
      tags: [Owner branches]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                currency: { type: string, pattern: '^[A-Z]{3}
    post:
      operationId: authLogin
      tags: [Authentication]
      description: Browser receives an HttpOnly refresh cookie; mobile receives refreshToken in JSON. Access token lasts 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
                client: { type: string, enum: [web, mobile], default: web }
      responses:
        '200': { description: Session issued }
        '400': { description: Validation failure }
        '401': { description: Invalid username, password or inactive user }
        '429': { description: Login throttled }
  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [Authentication]
      description: Refreshes and atomically rotates opaque credential. Body refreshToken is for mobile clients; web uses HttpOnly cookie and trusted Origin.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Mobile clients only }
      responses:
        '200': { description: Rotated session }
        '401': { description: Invalid or replayed refresh credential }
  /auth/logout:
    post:
      operationId: authLogout
      tags: [Authentication]
      description: Revoke the credential's session, including its access token.
      responses:
        '200': { description: Session revoked }
        '401': { description: Invalid credential }
  /auth/me:
    get:
      operationId: authMe
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user scope and password-change state }
        '401': { description: Missing or revoked session }
  /auth/change-password:
    post:
      operationId: authChangePassword
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      description: Sets a new password, clears the initial-change flag and revokes all sessions. Client must log in again.
      responses:
        '200': { description: Password changed }
        '400': { description: Invalid password }
        '401': { description: Missing or revoked session }
        '403': { description: Current password incorrect }
  /health/live:
    get:
      operationId: healthLive
      responses:
        '200': { description: Process is live }
  /health/ready:
    get:
      operationId: healthReady
      responses:
        '200': { description: Database is reachable }
        '503': { description: Database unavailable }
  /public/t/{qrToken}/sessions:
    post:
      operationId: createTableSession
      parameters:
        - in: path
          name: qrToken
