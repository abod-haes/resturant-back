    get:
      operationId: printOwnerTableQrs
      tags: [Owner QR printing]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: branchId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: tableIds
          schema: { type: string, maxLength: 3700 }
          description: Optional comma-separated UUIDv4 values (up to 100)
      responses:
        '200':
          description: A4 PDF QR labels, 6 per page, no-store
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { description: Invalid tableIds }
        '404': { description: Selected table not active/accessible }
        '409': { description: QR_PRINT_TOO_MANY or QR_REVOKED }
        '503': { description: QR_NOT_CONFIGURED }
  /public/t/{qrToken}:
    get:
      operationId: resolvePublicTableQr
      tags: [Public table QR]
      description: Active table context with dynamic callsAvailable and no visit token.
      parameters:
        - in: path
          name: qrToken
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        '200':
          description: Restaurant, branch, table, menuPath and settings-derived callsAvailable
        '403': { description: SUBSCRIPTION_INACTIVE or PLAN_FEATURE_DISABLED }
        '404': { description: QR_REVOKED, disabled or unavailable }
  /owner/branches:
    get:
      operationId: listOwnerBranches
      tags: [Owner branches]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated owner branch list }
        '403': { description: Subscription inactive }
    post:
      operationId: createOwnerBranch
      tags: [Owner branches]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        '201': { description: Branch created }
        '400': { description: Validation error }
        '403': { description: PLAN_LIMIT_REACHED }
  /auth/login:
    post:
      operationId: authLogin
      tags: [Authentication]
      description: Browser receives an HttpOnly refresh cookie; mobile receives refreshToken in JSON. Access token lasts 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
                client: { type: string, enum: [web, mobile], default: web }
      responses:
        '200': { description: Session issued }
        '400': { description: Validation failure }
        '401': { description: Invalid username, password or inactive user }
        '429': { description: Login throttled }
  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [Authentication]
      description: Refreshes and atomically rotates opaque credential. Body refreshToken is for mobile clients; web uses HttpOnly cookie and trusted Origin.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Mobile clients only }
      responses:
        '200': { description: Rotated session }
        '401': { description: Invalid or replayed refresh credential }
  /auth/logout:
    post:
      operationId: authLogout
      tags: [Authentication]
      description: Revoke the credential's session, including its access token.
      responses:
        '200': { description: Session revoked }
        '401': { description: Invalid credential }
  /auth/me:
    get:
      operationId: authMe
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user scope and password-change state }
        '401': { description: Missing or revoked session }
  /auth/change-password:
    post:
      operationId: authChangePassword
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      description: Sets a new password, clears the initial-change flag and revokes all sessions. Client must log in again.
      responses:
        '200': { description: Password changed }
        '400': { description: Invalid password }
        '401': { description: Missing or revoked session }
        '403': { description: Current password incorrect }
  /health/live:
    get:
      operationId: healthLive
      responses:
        '200': { description: Process is live }
  /health/ready:
    get:
      operationId: healthReady
      responses:
        '200': { description: Database is reachable }
        '503': { description: Database unavailable }
  /public/t/{qrToken}/sessions:
    post:
      operationId: createTableSession
      tags: [Public visit]
      description: Create a 4h-idle QR-bound visit session (token SHA256 stored).
      parameters:
        - in: path
          name: qrToken
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        '201': { description: sessionToken, ISO expiresAt, firstCallNeedsConfirmation, availableCallTypes }
        '403': { description: SUBSCRIPTION_INACTIVE }
        '404': { description: QR_REVOKED }
        '429': { description: SESSION_CAP_REACHED }
  /public/sessions/status:
    post:
      operationId: refreshVisitStatus
      tags: [Public visit]
      description: Validates visit and extends 4h inactivity expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionToken]
              properties:
                sessionToken: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
      responses:
        '200': { description: expiresAt, firstCallNeedsConfirmation, availableCallTypes }
        '401': { description: SESSION_EXPIRED }
        '404': { description: QR_REVOKED }
  /public/calls:
    post:
      operationId: createServiceCall
      tags: [Public calls]
      description: First call confirmed, per-table/type 10s cooldown, session-scoped idempotency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionToken, type, idempotencyKey]
              properties:
                sessionToken: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
                type: { type: string, enum: [waiter, hookah] }
                idempotencyKey: { type: string, format: uuid }
                confirmFirstCall: { type: boolean }
      responses:
        '201':
          description: Persisted call, NOT proof of push delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ServiceCall' }
        '401': { description: SESSION_EXPIRED }
        '403': { description: CALLS_DISABLED / CALL_TYPE_DISABLED / SUBSCRIPTION_INACTIVE }
        '404': { description: QR_REVOKED }
        '409': { description: FIRST_CALL_CONFIRMATION_REQUIRED / IDEMPOTENCY_KEY_REUSED }
        '429': { description: COOLDOWN_ACTIVE, details.retryAfterSeconds }
  /owner/branches/{branchId}:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnerBranch
      tags: [Owner branches]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Branch metadata }
        '404': { description: Branch not in tenant }
    patch:
      operationId: updateOwnerBranch
      tags: [Owner branches]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated branch }
        '400': { description: Invalid patch }
        '404': { description: Branch not found }
        '409': { description: BRANCH_CURRENCY_IN_USE }
  /owner/branches/{branchId}/categories:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOwnerCategories
      tags: [Owner categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { description: Paginated categories }
        '403': { description: Subscription inactive or PLAN_FEATURE_DISABLED }
        '404': { description: Tenant branch not found }
    post:
      operationId: createOwnerCategory
      tags: [Owner categories]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategory' }
      responses:
        '201': { description: Category created }
        '400': { description: Validation error }
        '409': { description: CATEGORY_NAME_TAKEN }
  /owner/branches/{branchId}/categories/{id}:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnerCategory
      tags: [Owner categories]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Category detail }
        '404': { description: Category not found }
    patch:
      operationId: patchOwnerCategory
      tags: [Owner categories]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 160 }
                description: { type: [string, "null"], maxLength: 1000 }
                sortOrder: { type: integer, minimum: 0, maximum: 1000000 }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated category }
        '400': { description: Invalid or empty patch }
        '409': { description: CATEGORY_NAME_TAKEN }
    delete:
      operationId: archiveOwnerCategory
      tags: [Owner categories]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Soft archived category }
        '404': { description: Category not found }
  /owner/branches/{branchId}/products:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOwnerProducts
      tags: [Owner products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { description: Paginated products }
        '403': { description: Subscription inactive or PLAN_FEATURE_DISABLED }
    post:
      operationId: createOwnerProduct
      tags: [Owner products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProduct' }
      responses:
        '201': { description: Product created }
        '400': { description: Invalid prices/media }
        '404': { description: Category not found in branch }
        '409': { description: BRANCH_CURRENCY_REQUIRED }
  /owner/branches/{branchId}/products/{id}:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnerProduct
      tags: [Owner products]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Product detail }
        '404': { description: Product not found }
    patch:
      operationId: patchOwnerProduct
      tags: [Owner products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                categoryId: { type: string, format: uuid }
                name: { type: string, maxLength: 200 }
                description: { type: [string, "null"], maxLength: 3000 }
                priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
                oldPriceMinor: { type: [integer, "null"], minimum: 1 }
                tags: { type: array, maxItems: 12, uniqueItems: true, items: { type: string, maxLength: 32 } }
                isVisible: { type: boolean }
                isSoldOut: { type: boolean }
                sortOrder: { type: integer, minimum: 0 }
                images:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri, description: Approved HTTPS origin only }
                      alt: { type: [string, "null"] }
      responses:
        '200': { description: Updated product, partial fields allowed }
        '400': { description: Invalid price or media URL }
        '404': { description: Product or category missing }
    delete:
      operationId: archiveOwnerProduct
      tags: [Owner products]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Product soft archived }
        '404': { description: Product not found }
  /owner/branches/{branchId}/menu/copy-from:
    post:
      operationId: copyOwnerMenu
      tags: [Owner menu copy]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: branchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceBranchId]
              properties:
                sourceBranchId: { type: string, format: uuid }
                includeTemplate: { type: boolean, default: false, description: 'true is not supported in v1.6' }
      responses:
        '201': { description: Independent menu copied into empty target }
        '400': { description: Template copy unsupported or same branch }
        '403': { description: No subscription/feature }
        '404': { description: Source or target not within tenant }
        '409': { description: MENU_TARGET_NOT_EMPTY, MENU_CURRENCY_MISMATCH }
  /public/menu/{slug}:
    get:
      operationId: getPublicMenu
      tags: [Public menu]
      description: Anonymous paginated, published-only products; no QR/call/session credentials.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { description: Restaurant, branch, page of products and associated page categories }
        '403': { description: SUBSCRIPTION_INACTIVE or PLAN_FEATURE_DISABLED }
        '404': { description: Menu not found }
  /public/menu/{slug}/categories:
    get:
      operationId: listPublicCategories
      tags: [Public menu]
      description: Paginated category index without table/QR/session capability.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { description: Published category page }
        '403': { description: Subscription not operational }

  /admin/platform-admins:
    get:
      operationId: listPlatformAdministrators
      tags: [Platform administrators]
      summary: Primary-only paginated administrator listing
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 500 } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Platform administrator page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdministratorList' }
        '403': { description: PRIMARY_ADMIN only }
    post:
      operationId: createPlatformAdministrator
      tags: [Platform administrators]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, username, initialPassword]
              properties:
                name: { type: string, maxLength: 200, minLength: 1 }
                username: { type: string, pattern: '^[A-Za-z0-9._-]{3,64}$' }
                initialPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '201':
          description: Platform administrator created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdministratorResponse' }
        '403': { description: PRIMARY_ADMIN only }
        '409': { description: PLATFORM_ADMIN_USERNAME_TAKEN }
  /admin/platform-admins/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPlatformAdministrator
      tags: [Platform administrators]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Platform administrator details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdministratorResponse' }
        '403': { description: PRIMARY_ADMIN only }
        '404': { description: Account absent or not PLATFORM_ADMIN }
    patch:
      operationId: updatePlatformAdministrator
      tags: [Platform administrators]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200, minLength: 1 }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated administrator, disabled accounts lose all sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdministratorResponse' }
        '403': { description: PRIMARY_ADMIN only }
        '404': { description: Account absent or not PLATFORM_ADMIN }
  /admin/platform-admins/{id}/reset-password:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resetPlatformAdministratorPassword
      tags: [Platform administrators]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [initialPassword]
              properties:
                initialPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Reset accepted, sessions revoked and next login requires password change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [reset]
                    properties:
                      reset: { type: boolean }
        '403': { description: PRIMARY_ADMIN only }
        '404': { description: Account absent or not PLATFORM_ADMIN }
