openapi: 3.1.0
info:
  title: Restaurant Platform API
  version: 0.12.0-draft
  description: "Versioned reference with all 96 implemented HTTP path/method pairs, checked against executable Nest Swagger. Some response schemas are summary-only; for exact DTO types use runtime /api/docs-json or the generated CI OpenAPI artifact."
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        requestId: { type: string }
    PageMeta:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, "null"] }
        hasMore: { type: boolean }
    RestaurantSummary:
      type: object
      required: [id, name, slug, isActive, createdAt, owner]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        owner:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, username]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                username: { type: string }
    Plan:
      type: object
      required: [id, name, maxBranches, maxTables, maxEmployees, features, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        maxBranches: { type: integer, minimum: 1 }
        maxTables: { type: integer, minimum: 1 }
        maxEmployees: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        features:
          type: object
          required: [menu, waiter_calls, hookah_calls, analytics]
          properties:
            menu: { type: boolean }
            waiter_calls: { type: boolean }
            hookah_calls: { type: boolean }
            analytics: { type: boolean }
    Subscription:
      type: object
      required: [id, restaurantId, planId, period, effectiveStatus, canOperate, graceDays, startsAt, endsAt, graceEndsAt, entitlements]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        period: { type: string, enum: [monthly, yearly] }
        effectiveStatus: { type: string, enum: [pending, scheduled, active, grace, expired, cancelled] }
        canOperate: { type: boolean }
        startsAt: { type: [string, "null"], format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
        graceEndsAt: { type: [string, "null"], format: date-time }
        graceDays: { type: integer, minimum: 0, maximum: 365 }
        entitlements:
          oneOf:
            - type: "null"
            - type: object
              properties:
                maxBranches: { type: integer }
                maxTables: { type: integer }
                maxEmployees: { type: integer }
                features: { type: object }
    RenewalContact:
      type: object
      required: [type, label, value, enabled]
      properties:
        type: { type: string, enum: [whatsapp, phone, email] }
        label: { type: string }
        value: { type: string }
        enabled: { type: boolean }
    Branch:
      type: object
      required: [id, name, slug, currency, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        currency: { type: [string, "null"], maxLength: 3 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, branchId, name, description, sortOrder, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProductImage:
      type: object
      required: [id, url, alt, sortOrder]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: Approved HTTPS CDN origin only }
        alt: { type: [string, "null"] }
        sortOrder: { type: integer }
    Product:
      type: object
      required: [id, branchId, categoryId, name, description, priceMinor, oldPriceMinor, currency, tags, isVisible, isSoldOut, sortOrder, images, createdAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
        oldPriceMinor: { type: [integer, "null"] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        tags: { type: array, items: { type: string }, maxItems: 12 }
        isVisible: { type: boolean }
        isSoldOut: { type: boolean }
        sortOrder: { type: integer }
        images: { type: array, items: { $ref: '#/components/schemas/ProductImage' }, maxItems: 8 }
        createdAt: { type: string, format: date-time }
    CreateCategory:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 1000 }
        sortOrder: { type: integer, minimum: 0, maximum: 1000000 }
        isActive: { type: boolean }
    CreateProduct:
      type: object
      additionalProperties: false
      required: [categoryId, name, priceMinor]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 3000 }
        priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
        oldPriceMinor: { type: [integer, "null"], minimum: 1 }
        tags: { type: array, maxItems: 12, uniqueItems: true, items: { type: string, maxLength: 32 } }
        isVisible: { type: boolean }
        isSoldOut: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
        images:
          type: array
          maxItems: 8
          items:
            type: object
            required: [url]
            properties:
              url: { type: string, format: uri, description: Allowed HTTPS origin, no query/hash }
              alt: { type: [string, "null"] }
    Floor:
      type: object
      required: [id, branchId, name, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        name: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    Area:
      type: object
      required: [id, branchId, floorId, name, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        floorId: { type: string, format: uuid }
        name: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    RestaurantTable:
      type: object
      required: [id, branchId, areaId, label, sortOrder, isActive, qrEnabled, callsEnabled, qrVersion]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        areaId: { type: string, format: uuid }
        label: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        qrEnabled: { type: boolean }
        callsEnabled: { type: boolean }
        qrVersion: { type: integer, minimum: 1 }
    QrData:
      type: object
      required: [url, version, enabled]
      properties:
        url: { type: string, format: uri, description: Encrypted-at-rest bearer QR URL for owner only }
        version: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    TablePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RestaurantTable' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ServiceCall:
      type: object
      required: [id, type, createdAt, deliveryState, recipientsCount, ownerAlerted, firstCallNeedsConfirmation]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [waiter, hookah] }
        createdAt: { type: string, format: date-time }
        deliveryState: { type: string, enum: [queued, no_staff] }
        recipientsCount: { type: integer, minimum: 0 }
        ownerAlerted: { type: boolean }
        firstCallNeedsConfirmation: { type: boolean }
    VisitCreated:
      type: object
      required: [sessionToken, expiresAt, firstCallNeedsConfirmation, availableCallTypes]
      properties:
        sessionToken: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
        firstCallNeedsConfirmation: { type: boolean }
        availableCallTypes: { type: array, items: { type: string, enum: [waiter, hookah] } }
    Employee:
      type: object
      required: [id, username, name, branchId, department, isActive, mustChangePassword, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        branchId: { type: string, format: uuid }
        department: { type: string, enum: [waiter, hookah] }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
    Shift:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        department: { type: string, enum: [waiter, hookah] }
        startedAt: { type: string, format: date-time }
        autoEndAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }

    PushDevice:
      type: object
      required: [id, platform, isActive, lastSeenAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios] }
        isActive: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RealtimeEvent:
      type: object
      required: [eventId, eventType, occurredAt, branchId, payload]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [call.created, owner.alert.created, shift.updated] }
        occurredAt: { type: string, format: date-time }
        branchId: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
    CallAnalyticsTotals:
      type: object
      required: [totalCalls, waiterCalls, hookahCalls, routedCalls, noStaffCalls, distinctTables]
      properties:
        totalCalls: { type: integer, minimum: 0 }
        waiterCalls: { type: integer, minimum: 0 }
        hookahCalls: { type: integer, minimum: 0 }
        routedCalls: { type: integer, minimum: 0, description: Routed to on-shift staff at recording time; NOT notification delivered }
        noStaffCalls: { type: integer, minimum: 0 }
        distinctTables: { type: integer, minimum: 0 }
    CallAnalyticsDaily:
      type: object
      required: [date, totalCalls, waiterCalls, hookahCalls, routedCalls, noStaffCalls]
      properties:
        date: { type: string, format: date }
        totalCalls: { type: integer, minimum: 0 }
        waiterCalls: { type: integer, minimum: 0 }
        hookahCalls: { type: integer, minimum: 0 }
        routedCalls: { type: integer, minimum: 0 }
        noStaffCalls: { type: integer, minimum: 0 }
    CallAnalyticsReport:
      type: object
      required: [from, to, branchId, summary, daily]
      properties:
        from: { type: string, format: date, description: Inclusive UTC calendar day }
        to: { type: string, format: date, description: Exclusive UTC calendar day }
        branchId: { type: [string, "null"], format: uuid }
        summary: { $ref: '#/components/schemas/CallAnalyticsTotals' }
        daily:
          type: array
          maxItems: 90
          items: { $ref: '#/components/schemas/CallAnalyticsDaily' }
    AdminAuditEntry:
      type: object
      required: [id, actorId, restaurantId, action, entityType, entityId, requestId, createdAt]
      description: Metadata intentionally excluded; may contain private or secret values.
      properties:
        id: { type: string, format: uuid }
        actorId: { type: [string, "null"], format: uuid }
        restaurantId: { type: [string, "null"], format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, "null"], format: uuid }
        requestId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    ManagedMedia:
      type: object
      required: [id, branchId, kind, url, name, contentType, byteSize, width, height, createdAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        kind: { type: string, enum: [image, document] }
        url: { type: [string, "null"], description: Only images have an HTTPS public CDN URL }
        name: { type: string, maxLength: 200 }
        contentType: { type: string, enum: [image/webp, application/pdf] }
        byteSize: { type: integer, minimum: 1 }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
    ProductGalleryImage:
      type: object
      required: [id, mediaId, url, alt, sortOrder, isPrimary]
      properties:
        id: { type: string, format: uuid }
        mediaId: { type: [string, "null"], format: uuid }
        url: { type: string, format: uri }
        alt: { type: [string, "null"], maxLength: 200 }
        sortOrder: { type: integer, minimum: 0, maximum: 7 }
        isPrimary: { type: boolean }
    PlatformAdministrator:
      type: object
      required: [id, username, name, role, isActive, mustChangePassword, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        role: { type: string, enum: [PLATFORM_ADMIN] }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
    PlatformAdministratorResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PlatformAdministrator' }
    PlatformAdministratorList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PlatformAdministrator' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
paths:
  /owner/branches/{branchId}/media:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOwnerMediaLibrary
      tags: [Owner media library]
      security: [{ bearerAuth: [] }]
      description: Branch-owned ready objects; no private object keys.
      parameters:
        - in: query
          name: kind
          schema: { type: string, enum: [image, document] }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Keyset-paginated media metadata }
        '403': { description: Missing menu entitlement or subscription }
        '404': { description: Branch not owned by caller }
  /owner/branches/{branchId}/media/images:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: uploadOwnerImage
      tags: [Owner media library]
      security: [{ bearerAuth: [] }]
      description: JPEG, PNG, WebP maximum 8 MiB converted to immutable WebP (2000px max).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Image uploaded; returns ready CDN metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ManagedMedia' }
        '400': { description: Missing file }
        '413': { description: MEDIA_TOO_LARGE }
        '415': { description: MEDIA_UNSUPPORTED }
        '409': { description: MEDIA_LIBRARY_LIMIT }
        '503': { description: MEDIA_STORAGE_NOT_CONFIGURED or MEDIA_UPLOAD_FAILED }
  /owner/branches/{branchId}/media/documents:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: uploadOwnerPrivatePdf
      tags: [Owner media library]
      security: [{ bearerAuth: [] }]
      description: Owner-only PDF upload maximum 10 MiB, private, never exposed in public menu.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Ready private PDF metadata with url=null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ManagedMedia' }
        '413': { description: MEDIA_TOO_LARGE }
        '415': { description: MEDIA_UNSUPPORTED }
        '503': { description: MEDIA_STORAGE_NOT_CONFIGURED or MEDIA_UPLOAD_FAILED }
  /owner/branches/{branchId}/media/{id}:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteOwnerMediaAsset
      tags: [Owner media library]
      security: [{ bearerAuth: [] }]
      description: Deletes only unreferenced assets. S3 failures persist deletion for cleanup retry.
      responses:
        '200': { description: '{data:{deleted:true}}' }
        '404': { description: Not in tenant/branch or already removed }
        '409': { description: MEDIA_IN_USE }
        '503': { description: MEDIA_DELETE_PENDING }
  /owner/branches/{branchId}/media/{id}/download:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnerPrivatePdfDownload
      tags: [Owner media library]
      security: [{ bearerAuth: [] }]
      description: Authorized 60-second presigned attachment URL for private PDFs, Cache-Control no-store.
      responses:
        '200': { description: '{data:{url,expiresInSeconds:60}}' }
        '404': { description: Not an owned ready private PDF }
  /owner/branches/{branchId}/products/{productId}/gallery:
    parameters:
      - in: path
        name: branchId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: productId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnerProductMediaGallery
      tags: [Owner product galleries]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ordered images, including legacy URLs with mediaId=null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductGalleryImage' }
        '404': { description: Product not in tenant/branch }
    put:
      operationId: replaceOwnerProductMediaGallery
      tags: [Owner product galleries]
      security: [{ bearerAuth: [] }]
      description: Atomic 0..8 ordered managed image references; first image primary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    additionalProperties: false
                    required: [mediaId]
                    properties:
                      mediaId: { type: string, format: uuid }
                      alt: { type: [string, "null"], maxLength: 200 }
      responses:
        '200': { description: Updated ordered product gallery }
        '400': { description: MEDIA_DUPLICATED or DTO validation }
        '404': { description: Foreign/missing product or media ID }
  /owner/call-analytics:
    get:
      operationId: getOwnerCallAnalytics
      tags: [Owner analytics]
      security: [{ bearerAuth: [] }]
      description: RESTAURANT_OWNER only with active analytics plan entitlement; UTC date-only [from,to), max 90 calendar days.
      parameters:
        - in: query
          name: from
          description: Inclusive UTC YYYY-MM-DD; requires to; default is 29 days before today
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Exclusive UTC YYYY-MM-DD; requires from; default is tomorrow
          schema: { type: string, format: date }
        - in: query
          name: branchId
          description: Optional branch belonging to the JWT restaurant
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bound to tenant and feature; all days zero-filled, routed NOT push delivered
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CallAnalyticsReport' }
        '400': { description: Invalid date, range or branchId format }
        '401': { description: Missing access token }
        '403': { description: Non-owner, SUBSCRIPTION_INACTIVE or PLAN_FEATURE_DISABLED }
        '404': { description: Unknown or foreign branch }
  /employee/devices:
    get:
      operationId: listEmployeePushDevices
      tags: [Employee Push Devices]
      security: [{ bearerAuth: [] }]
      description: Employee-owned device metadata, never the Expo push token.
      responses:
        '200':
          description: Own active devices, at most five
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PushDevice' }
        '403': { description: Role or subscription inactive }
    post:
      operationId: registerEmployeePushDevice
      tags: [Employee Push Devices]
      security: [{ bearerAuth: [] }]
      description: Register encrypted Expo push token; idempotent for own token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expoPushToken, platform]
              properties:
                expoPushToken: { type: string, writeOnly: true, minLength: 25, maxLength: 300 }
                platform: { type: string, enum: [android, ios] }
      responses:
        '201':
          description: Device registered without echoing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PushDevice' }
        '400': { description: Invalid token or platform }
        '401': { description: Missing bearer }
        '403': { description: Not an employee or inactive subscription }
        '409': { description: DEVICE_ALREADY_REGISTERED or DEVICE_LIMIT_REACHED }
        '503': { description: PUSH_NOT_CONFIGURED }
  /employee/devices/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: unregisterEmployeePushDevice
      tags: [Employee Push Devices]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Device unregistered in own account }
        '404': { description: Device not in caller account }
  /owner/events:
    get:
      operationId: streamOwnerRealtimeEvents
      tags: [Realtime SSE]
      security: [{ bearerAuth: [] }]
      description: Authenticated owner tenant-scoped SSE stream with cursor replay.
      parameters:
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
        - in: header
          name: Last-Event-ID
          schema: { type: string }
      responses:
        '200':
          description: SSE stream with five-minute reconnection and heartbeats
          content:
            text/event-stream:
              schema: { type: string, description: Server-Sent Events carrying RealtimeEvent data }
        '401': { description: Missing or expired bearer JWT }
        '403': { description: Not owner or subscription inactive }
  /employee/events:
    get:
      operationId: streamEmployeeRealtimeEvents
      tags: [Realtime SSE]
      security: [{ bearerAuth: [] }]
      description: Recipient-scoped SSE with bearer in Authorization header, never query string.
      parameters:
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
        - in: header
          name: Last-Event-ID
          schema: { type: string }
      responses:
        '200':
          description: Employee-assigned events, no cross-tenant payloads
          content:
            text/event-stream:
              schema: { type: string, description: SSE JSON event stream }
        '401': { description: Missing or expired bearer JWT }
        '403': { description: Not employee or subscription inactive }
  /owner/employees:
